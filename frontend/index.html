<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playproof Socket Test</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 24px;
        color: #111;
      }
      h1 {
        margin-bottom: 8px;
      }
      .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .card {
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 12px;
      }
      label {
        display: block;
        font-size: 12px;
        color: #555;
        margin-bottom: 4px;
      }
      input, button {
        font-size: 14px;
        padding: 8px 10px;
      }
      input {
        width: 260px;
      }
      button {
        cursor: pointer;
      }
      pre {
        background: #0b1020;
        color: #e5e7eb;
        padding: 12px;
        border-radius: 8px;
        min-height: 160px;
        overflow: auto;
      }
      .participants {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 8px 0 16px;
      }
      .participant-card {
        border: 2px solid #e5e7eb;
        border-radius: 8px;
        padding: 8px 10px;
        min-width: 180px;
        background: #fafafa;
      }
      .participant-card.speaking {
        border-color: #22c55e;
        box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.2);
      }
      .participant-name {
        font-weight: 600;
        font-size: 14px;
      }
      .participant-meta {
        font-size: 12px;
        color: #666;
      }
      .log-row {
        margin: 0 0 6px 0;
      }
      .muted {
        color: #777;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Playproof Socket Test</h1>
    <p class="muted">Socket.IO + LiveKit 테스트용 간단 페이지</p>

    <div class="row">
      <div class="card">
        <label for="serverUrl">Server URL</label>
        <input id="serverUrl" value="http://localhost:3000" />
      </div>
      <div class="card">
        <label for="livekitUrl">LiveKit URL</label>
        <input id="livekitUrl" placeholder="예: wss://livekit.example.com" />
      </div>
      <div class="card">
        <label for="token">JWT Token</label>
        <input id="token" placeholder="Bearer token 없이 값만 입력" />
      </div>
    </div>

    <div class="row">
      <button id="connectBtn">Connect</button>
      <button id="disconnectBtn" disabled>Disconnect</button>
    </div>

    <div class="row">
      <div class="card">
        <label for="roomId">Room ID</label>
        <input id="roomId" value="1" />
      </div>
      <div class="card">
        <label for="message">Message</label>
        <input id="message" placeholder="메시지 입력" />
      </div>
    </div>

    <div class="row">
      <button id="joinRoomBtn">joinRoom</button>
      <button id="leaveRoomBtn">leaveRoom</button>
      <button id="sendMessageBtn">sendMessage</button>
    </div>

    <div class="row">
      <button id="voiceJoinBtn">voiceJoin</button>
      <button id="voiceLeaveBtn">voiceLeave</button>
    </div>

    <div class="row">
      <button id="voiceConnectBtn">LiveKit Connect</button>
      <button id="voiceDisconnectBtn" disabled>LiveKit Disconnect</button>
      <button id="micToggleBtn" disabled>Mic On</button>
    </div>

    <div id="audioContainer"></div>

    <h3>Participants</h3>
    <div id="participants" class="participants"></div>

    <h3>Logs</h3>
    <pre id="logs"></pre>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
      const logEl = document.getElementById("logs");
      const serverUrlEl = document.getElementById("serverUrl");
      const livekitUrlEl = document.getElementById("livekitUrl");
      const tokenEl = document.getElementById("token");
      const roomIdEl = document.getElementById("roomId");
      const messageEl = document.getElementById("message");
      const connectBtn = document.getElementById("connectBtn");
      const disconnectBtn = document.getElementById("disconnectBtn");
      const voiceConnectBtn = document.getElementById("voiceConnectBtn");
      const voiceDisconnectBtn = document.getElementById("voiceDisconnectBtn");
      const micToggleBtn = document.getElementById("micToggleBtn");
      const audioContainer = document.getElementById("audioContainer");
      const participantsEl = document.getElementById("participants");

      let socket = null;
      let livekitRoom = null;
      let micEnabled = false;
      let isVoiceJoined = false;
      const audioElements = new Map();
      const participantCards = new Map();
      const loadLiveKitSdk = () => {
        if (window.LivekitClient) return Promise.resolve(window.LivekitClient);
        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = "https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js";
          script.onload = () => {
            if (window.LivekitClient) return resolve(window.LivekitClient);
            return reject(new Error("LivekitClient is not defined"));
          };
          script.onerror = () => reject(new Error("LiveKit SDK 로드 실패"));
          document.head.appendChild(script);
        });
      };
      const ensureParticipantCard = (participant) => {
        if (!isVoiceJoined) return null;
        const id = participant.identity;
        if (participantCards.has(id)) return participantCards.get(id);

        const card = document.createElement("div");
        card.className = "participant-card";
        card.dataset.identity = id;

        const name = document.createElement("div");
        name.className = "participant-name";
        name.textContent = participant.name || `User ${id}`;

        const meta = document.createElement("div");
        meta.className = "participant-meta";
        meta.textContent = `identity: ${id}`;

        card.appendChild(name);
        card.appendChild(meta);
        participantsEl.appendChild(card);
        participantCards.set(id, card);
        return card;
      };

      const removeParticipantCard = (participant) => {
        if (!isVoiceJoined) return;
        const id = participant.identity;
        const card = participantCards.get(id);
        if (!card) return;
        card.remove();
        participantCards.delete(id);
      };

      const updateSpeakingState = (speakers) => {
        if (!isVoiceJoined) return;
        const speakingSet = new Set(speakers.map((p) => p.identity));
        for (const [id, card] of participantCards) {
          card.classList.toggle("speaking", speakingSet.has(id));
        }
      };

      const log = (label, data) => {
        const time = new Date().toLocaleTimeString();
        const line = document.createElement("div");
        line.className = "log-row";
        const body = data === undefined ? "" : ` ${JSON.stringify(data)}`;
        line.textContent = `[${time}] ${label}${body}`;
        logEl.appendChild(line);
        logEl.scrollTop = logEl.scrollHeight;
      };

      const getRoomId = () => Number(roomIdEl.value);

      const setConnectedState = (connected) => {
        connectBtn.disabled = connected;
        disconnectBtn.disabled = !connected;
      };

      const setLiveKitState = (connected) => {
        voiceConnectBtn.disabled = connected;
        voiceDisconnectBtn.disabled = !connected;
        micToggleBtn.disabled = !connected;
        micToggleBtn.textContent = micEnabled ? "Mic Off" : "Mic On";
      };

      const attachAudioTrack = (track) => {
        const element = track.attach();
        audioContainer.appendChild(element);
        audioElements.set(track.sid, element);
      };

      const detachAudioTrack = (track) => {
        const element = audioElements.get(track.sid);
        if (!element) return;
        track.detach(element);
        element.remove();
        audioElements.delete(track.sid);
      };

      const fetchVoiceToken = async (roomId) => {
        const token = tokenEl.value?.trim();
        if (!token) {
          log("voice_token_error", { message: "JWT Token이 필요합니다." });
          return null;
        }

        const res = await fetch(`${serverUrlEl.value}/chat-rooms/${roomId}/voice-token`, {
          method: "GET",
          headers: {
            Authorization: `Bearer ${token}`,
          },
        });
        const json = await res.json();
        if (!res.ok || json?.error) {
          log("voice_token_error", json?.error || { message: "토큰 발급 실패" });
          return null;
        }
        return json?.data || null;
      };

      const connectLiveKit = async () => {
        let LiveKitSdk = null;
        try {
          LiveKitSdk = await loadLiveKitSdk();
        } catch (error) {
          log("livekit_error", { message: error?.message || "LiveKit SDK 로드 실패" });
          return;
        }
        const roomId = getRoomId();
        if (!Number.isFinite(roomId)) {
          log("livekit_error", { message: "roomId가 올바르지 않습니다." });
          return;
        }

        const tokenData = await fetchVoiceToken(roomId);
        if (!tokenData) return;

        const livekitUrl = tokenData.url || livekitUrlEl.value?.trim();
        if (!livekitUrl) {
          log("livekit_error", { message: "LiveKit URL이 필요합니다." });
          return;
        }

        livekitRoom = new LiveKitSdk.Room();
        const { RoomEvent } = LiveKitSdk;

        livekitRoom.on(RoomEvent.TrackSubscribed, (track) => {
          if (track.kind === "audio") {
            attachAudioTrack(track);
          }
        });

        livekitRoom.on(RoomEvent.TrackUnsubscribed, (track) => {
          if (track.kind === "audio") {
            detachAudioTrack(track);
          }
        });

        livekitRoom.on(RoomEvent.ParticipantConnected, (participant) => {
          ensureParticipantCard(participant);
        });

        livekitRoom.on(RoomEvent.ParticipantDisconnected, (participant) => {
          removeParticipantCard(participant);
        });

        livekitRoom.on(RoomEvent.ActiveSpeakersChanged, (speakers) => {
          updateSpeakingState(speakers);
        });

        livekitRoom.on(RoomEvent.Disconnected, (reason) => {
          log("livekit_disconnected", { reason });
          livekitRoom = null;
          micEnabled = false;
          setLiveKitState(false);
        });

        await livekitRoom.connect(livekitUrl, tokenData.token);
        log("livekit_connected", { roomName: tokenData.roomName, identity: tokenData.identity });

        if (isVoiceJoined) {
          ensureParticipantCard(livekitRoom.localParticipant);
          livekitRoom.remoteParticipants.forEach((participant) => ensureParticipantCard(participant));
        }

        micEnabled = true;
        await livekitRoom.localParticipant.setMicrophoneEnabled(true);
        setLiveKitState(true);
      };

      const disconnectLiveKit = () => {
        if (!livekitRoom) return;
        livekitRoom.disconnect();
        participantsEl.innerHTML = "";
        participantCards.clear();
        isVoiceJoined = false;
      };

      const toggleMic = async () => {
        if (!livekitRoom) return;
        micEnabled = !micEnabled;
        await livekitRoom.localParticipant.setMicrophoneEnabled(micEnabled);
        setLiveKitState(true);
        log("mic_toggle", { enabled: micEnabled });
      };

      connectBtn.addEventListener("click", () => {
        if (socket) socket.disconnect();

        socket = io(serverUrlEl.value, {
          auth: { token: tokenEl.value },
          transports: ["websocket"],
        });

        socket.on("connect", () => {
          setConnectedState(true);
          log("connected", { id: socket.id });
        });

        socket.on("connect_error", (err) => {
          log("connect_error", { message: err.message });
        });

        socket.on("error", (err) => {
          log("error", err);
        });

        socket.on("newMessage", (data) => {
          log("newMessage", data);
        });

        socket.on("disconnect", (reason) => {
          setConnectedState(false);
          log("disconnected", { reason });
        });
      });

      disconnectBtn.addEventListener("click", () => {
        if (!socket) return;
        socket.disconnect();
      });

      document.getElementById("joinRoomBtn").addEventListener("click", () => {
        if (!socket) return;
        socket.emit("joinRoom", { roomId: getRoomId() }, (res) => log("joinRoom ack", res));
      });

      document.getElementById("leaveRoomBtn").addEventListener("click", () => {
        if (!socket) return;
        socket.emit("leaveRoom", { roomId: getRoomId() });
        log("leaveRoom sent");
      });

      document.getElementById("sendMessageBtn").addEventListener("click", () => {
        if (!socket) return;
        const content = messageEl.value;
        socket.emit("sendMessage", { roomId: getRoomId(), content }, (res) => log("sendMessage ack", res));
      });

      document.getElementById("voiceJoinBtn").addEventListener("click", () => {
        if (!socket) return;
        socket.emit("voiceJoin", { roomId: getRoomId() }, (res) => {
          log("voiceJoin ack", res);
          if (res?.ok) {
            isVoiceJoined = true;
            participantsEl.innerHTML = "";
            participantCards.clear();
            if (livekitRoom) {
              ensureParticipantCard(livekitRoom.localParticipant);
              livekitRoom.remoteParticipants.forEach((participant) => ensureParticipantCard(participant));
            }
          }
        });
      });

      document.getElementById("voiceLeaveBtn").addEventListener("click", () => {
        if (!socket) return;
        socket.emit("voiceLeave", { roomId: getRoomId() }, (res) => {
          log("voiceLeave ack", res);
          if (res?.ok) {
            isVoiceJoined = false;
            participantsEl.innerHTML = "";
            participantCards.clear();
          }
        });
      });

      voiceConnectBtn.addEventListener("click", async () => {
        try {
          await connectLiveKit();
        } catch (error) {
          log("livekit_error", { message: error?.message || "연결 실패" });
        }
      });

      voiceDisconnectBtn.addEventListener("click", () => {
        disconnectLiveKit();
      });

      micToggleBtn.addEventListener("click", async () => {
        try {
          await toggleMic();
        } catch (error) {
          log("mic_toggle_error", { message: error?.message || "마이크 토글 실패" });
        }
      });
    </script>
  </body>
</html>
